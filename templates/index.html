<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Galería Creativa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>Bienvenido a la Galería Creativa</h1>
    </header>

    <main>
        <section class="upload-section">
            <h2>Sube tu imagen</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <input type="file" name="image" accept="image/*">
                <button type="submit">Subir Imagen</button>
            </form>
        </section>

        <section class="edit-section">
            <h2>Editar Texto</h2>
            <textarea id="editable-text" contenteditable="true" placeholder="Escribe tu historia aquí..."></textarea>
            <button onclick="guardarTexto()">Guardar Texto</button>
        </section>
    </main>

    <footer>
        <p>© 2025 Galería Creativa</p>
    </footer>

    <script>
        function guardarTexto() {
            const texto = document.getElementById('editable-text').value;
            alert("Texto guardado: " + texto);
            // Aquí puedes enviar el texto a tu backend si quieres
        }
    </script>
</body>
</html>
